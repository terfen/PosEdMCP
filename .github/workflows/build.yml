name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build
        run: gradle assembleRelease --no-daemon
        env:
          TERM: dumb

      - name: Sign APK
        env:
          KS_B64:   ${{ secrets.KS_B64 }}
          KS_PASS:  ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > keystore.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $BT/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out PosEdMCP-signed.apk "$APK"
          $BT/apksigner verify --print-certs PosEdMCP-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PosEdMCP-signed
          path: PosEdMCP-signed.apk
